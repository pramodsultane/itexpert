<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pramod Sultane — IT Expert Application</title>
<meta name="description" content="IT Expert Application

">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="progress" class="progress" aria-hidden="true"><span></span></div>

<header class="topbar">
  <div class="wordmark">
    <span class="brand-mark" aria-label="Michelin technology portfolio" title="Michelin technology portfolio">
      <span class="brand-mark-dot"></span><span class="brand-mark-dot"></span><span class="brand-mark-dot"></span>
    </span>
    <span class="wordmark-name">Pramod Sultane</span>
    <span class="wordmark-sep"></span>
    <span class="wordmark-role">IT Expert Application</span>
  </div>
  <div class="topbar-actions">
    <span class="counter" id="counter" aria-live="polite"></span>
    <button id="themeToggle" class="ghost-btn" type="button" aria-label="Switch to light theme">
      <span id="themeLabel">Light</span>
    </button>
  </div>
</header>

<main id="deck" class="deck"></main>

<nav class="rail" id="dots" aria-label="Sections"></nav>

<div class="slide-hint" aria-hidden="true">&larr; / &rarr; &middot; scroll &middot; swipe</div>

<div class="arrows">
  <button id="prev" class="arrow" type="button" aria-label="Previous section">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="next" class="arrow" type="button" aria-label="Next section">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Diagram viewer">
  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close diagram">&times;</button>
  <figure>
    <img id="lightboxImg" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
